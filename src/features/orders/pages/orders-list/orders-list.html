<div class="orders-page">

    <!-- Back to Products -->
    <div class="mb-3">

        <button type="button" class="btn btn-outline-primary" (click)="goToProducts()">

            ← Back to Products

        </button>

    </div>


    <div class="page-header">

        <div>
            <h2>Orders</h2>
            <p>Manage customer orders</p>
        </div>

        <button type="button" class="btn btn-primary" (click)="goToCreateOrder()">

            + Create Order

        </button>

    </div>


    @if (errorMessage) {

    <div class="alert alert-danger">

        {{ errorMessage }}

        <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="loadOrders()">

            Retry

        </button>

    </div>

    }


    <!-- =====================================================
         ACTION TEMPLATE
    ====================================================== -->

    <ng-template #actionTemplate let-row>

        <button type="button" class="btn btn-sm btn-danger" (click)="deleteOrder(row); $event.stopPropagation()">

            Delete

        </button>

    </ng-template>


    <!-- =====================================================
         DATA GRID
    ====================================================== -->

    <app-data-grid [rows]="orders" [columns]="columns" [loading]="loading" [page]="page" [pageSize]="pageSize"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"
        (sortChange)="onSortChange($event)" (rowClick)="onRowClick($event)" />

</div>
