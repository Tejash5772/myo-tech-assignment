<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">
            Products
        </h2>

        <div class="d-flex gap-2">

            <button class="btn btn-outline-success" (click)="exportProducts()">
                Export CSV
            </button>

            <button class="btn btn-outline-danger" (click)="exportProductsPdf()">
                Export PDF
            </button>

            <button class="btn btn-primary" appDebounceClick appPermission="CREATE" (debounceClick)="openAddProduct()">

                Add Product

            </button>

        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-4">

            <input class="form-control" type="text" placeholder="Search products..." [ngModel]="search()"
                (ngModelChange)="onSearch($event)">

        </div>

    </div>

    <!-- Image Template -->
    <ng-template #imageTemplate let-row>

        @if (row.image) {

        <img [src]="row.image" alt="Product" width="60" height="60" class="rounded border" style="object-fit: cover;">

        } @else {

        <span class="text-muted">
            No Image
        </span>

        }

    </ng-template>

    <!-- Existing Action Template -->
    <ng-template #actionTemplate let-row>

        <!-- Keep your existing Edit/Delete buttons here -->

        <button class="btn btn-sm btn-primary me-2" (click)="openEditProduct(row); $event.stopPropagation()">

            Edit

        </button>

        <button class="btn btn-sm btn-danger" (click)="deleteProduct(row); $event.stopPropagation()">

            Delete

        </button>

    </ng-template>

    <app-data-grid [rows]="products()" [columns]="columns" [loading]="loading()" [page]="page" [pageSize]="pageSize"
        [totalRecords]="totalRecords()" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"
        (sortChange)="onSortChange($event)">

    </app-data-grid>

    @if (showModal()) {

    <div class="modal-backdrop-custom">

        <div class="modal-content-custom">

            <div class="d-flex justify-content-between mb-3">

                <h4>

                    {{ selectedProduct() ? 'Edit Product' : 'Add Product' }}

                </h4>

                <button class="btn-close" (click)="closeModal()">
                </button>

            </div>

            <app-product-form [product]="selectedProduct()" [categories]="categories()" (save)="saveProduct($event)"
                (cancel)="closeModal()">

            </app-product-form>

        </div>

    </div>

    }

</div>
